name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          # SAFETY (2026-10-04): this was `safenestt_ai` — the PRODUCTION
          # database name. The service container is itself throwaway, but using
          # the production name meant the CI job could not be distinguished
          # from a real production run, and scripts/ci-safety-gate.sh (which
          # refuses that name outright) would fail the job. It is now an
          # explicitly-named test database.
          POSTGRES_DB: safenestt_ai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # -------------------------------------------------------------------
      # SAFETY GATE — MUST run before pytest, and must not be bypassable.
      #
      # The gate is invoked with `--run`, so the pytest command lives INSIDE
      # the gate invocation. That is deliberate: a later `python -m pytest`
      # step would be a separate command that the gate never sees. Putting the
      # test command behind the gate makes "run tests" and "verify not
      # production" the same atomic action.
      #
      # The gate exits 2 on a production target, which fails the step and the
      # job. `tests/conftest.py` independently aborts the session (via
      # pytest.UsageError) if anything still points at production, so there are
      # two independent barriers before a socket can be opened.
      # -------------------------------------------------------------------
      - name: Safety gate — refuse to run tests against production
        run: |
          chmod +x scripts/ci-safety-gate.sh
          scripts/ci-safety-gate.sh

      - name: Run tests (gated — cannot reach production)
        env:
          DB_NAME: safenestt_ai_test
          DATABASE_URL: "postgresql://postgres:***@localhost:5432/safenestt_ai_test"
          SAFENESTT_DATABASE_URL: "postgresql://postgres:***@localhost:5432/safenestt_ai_test"
          SAFENESTT_OWNER_DATABASE_URL: "postgresql://postgres:***@localhost:5432/safenestt_ai_test"
          POSTGRES_PASSWORD: testpass
          SAFENESTT_OWNER_PASSWORD: testpass
        run: |
          scripts/ci-safety-gate.sh --run python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Security scan (pip audit)
        run: |
          pip install pip-audit
          pip-audit --strict

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: safenestt-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container starts
        run: |
          docker run --rm -d --name safenestt-test \
            -e MODE=development \
            -e OPENROUTER_API_KEY=test \
            -p 8000:8000 \
            safenestt-ai:latest
          sleep 10
          curl -f http://localhost:8000/v1/health || exit 1
          docker stop safenestt-test
