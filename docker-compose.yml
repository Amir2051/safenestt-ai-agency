# Docker Compose for local development with SSL-enabled PostgreSQL
# Production should use managed PostgreSQL with SSL enforced

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: safenestt_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount SSL certs for production-like setup
      # - ./certs/server.crt:/var/lib/postgresql/server.crt:ro
      # - ./certs/server.key:/var/lib/postgresql/server.key:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c max_connections=100
        -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      MODE: ${MODE:-development}
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${WORKERS:-2}
      DATABASE_URL: postgresql://safenestt_app:${DB_PASSWORD:-safenestt_app_pass}@postgres:5432/safenestt_ai
      SAFENESTT_DB_PASSWORD: ${DB_PASSWORD:-safenestt_app_pass}
      SAFENESTT_OWNER_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SAFENESTT_ENCRYPTION_KEY: ${SAFENESTT_ENCRYPTION_KEY:-}
      DB_SSL_MODE: ${DB_SSL_MODE:-prefer}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
