# Docker Compose: full SSL-enabled stack for production-like testing

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: safenestt_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs/server.crt:/var/lib/postgresql/server.crt:ro
      - ./certs/server.key:/var/lib/postgresql/server.key:ro
      - ./certs/ca.crt:/var/lib/postgresql/ca.crt:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c max_connections=100
        -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migration job: runs once, then exits. Holds owner credentials ONLY here.
  # This is a one-shot container, not part of the always-running API stack.
  migrate:
    build: .
    command: python -m safenestt.persistence.migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: safenestt_ai
      SAFENESTT_OWNER_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/safenestt_ai
      DB_SSL_MODE: verify-full
      DB_SSL_ROOT_CERT: /app/certs/ca.crt
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Entrypoint script: waits for migrate to complete before starting API
  api:
    build: .
    # Pre-start security gate, using the SAME implementation as systemd
    # (ExecStartPre) and start-engine.sh: safenestt/persistence/startup_gate.py.
    #
    #   1. wait for postgres to accept connections
    #   2. wait for the privileged `migrate` job to publish its marker
    #   3. VERIFY the database security state (read-only, app credentials)
    #   4. only then start uvicorn
    #
    # Step 3 is a pre-start gate, not a post-start probe: uvicorn is never
    # exec'd while the security state is unverified, so no listening socket is
    # opened on an unverified database.
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        ! dockerize -wait tcp://postgres:5432 -timeout 60s 2>/dev/null &&
        echo 'Waiting for migration to complete...' &&
        python -m safenestt.persistence.wait_for_migrate &&
        echo 'Running pre-start security gate...' &&
        python -m safenestt.persistence.startup_gate --verify &&
        echo 'Security gate passed.' &&
        uvicorn safenestt.api.app:app --host 0.0.0.0 --port 8000
      "
    environment:
      MODE: ${MODE:-production}
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${WORKERS:-2}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: safenestt_ai
      SAFENESTT_DB_PASSWORD: ${DB_PASSWORD:-safenestt_app_pass}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SAFENESTT_ENCRYPTION_KEY: ${SAFENESTT_ENCRYPTION_KEY:-}
      DB_SSL_MODE: verify-full
      DB_SSL_ROOT_CERT: /app/certs/ca.crt
      # NO SAFENESTT_OWNER_PASSWORD — API runs as least-privilege role only.
      # /v1/ready is the traffic gate: it returns 503 until migrate has
      # installed the required RLS state.
    healthcheck:
      # Readiness, not liveness: withhold traffic until the database security
      # state is installed. /v1/health (liveness) stays independent.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
