# Docker Compose: full SSL-enabled stack for production-like testing

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: safenestt_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs/server.crt:/var/lib/postgresql/server.crt:ro
      - ./certs/server.key:/var/lib/postgresql/server.key:ro
      - ./certs/ca.crt:/var/lib/postgresql/ca.crt:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c max_connections=100
        -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migration job: runs once, then exits. Holds owner credentials ONLY here.
  migrate:
    build: .
    command: python -m safenestt.persistence.migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: safenestt_ai
      SAFENESTT_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_SSL_MODE: verify-full
      DB_SSL_ROOT_CERT: /app/certs/ca.crt
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      MODE: ${MODE:-development}
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${WORKERS:-2}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: safenestt_ai
      SAFENESTT_DB_PASSWORD: ${DB_PASSWORD:-safenestt_app_pass}
      # NO SAFENESTT_OWNER_PASSWORD — API runs as least-privilege role only
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SAFENESTT_ENCRYPTION_KEY: ${SAFENESTT_ENCRYPTION_KEY:-}
      DB_SSL_MODE: verify-full
      DB_SSL_ROOT_CERT: /app/certs/ca.crt
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
