[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safenestt"
version = "0.1.0"
description = "SafeNestT AI investigation engine"
requires-python = ">=3.11"

dependencies = [
  "dnspython>=2.6,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.6,<3",
  "uvicorn>=0.30,<1",
  "starlette>=0.37,<2",
  "ddgs>=6.0,<10",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pip-audit",
]
kms-aws = ["boto3"]
kms-gcp = ["google-cloud-secret-manager"]
prod = [
  "uvloop",
  "httptools",
]

[tool.setuptools.packages.find]
include = ["safenestt*", "modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
